<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mendeley OAuth Token Helper</title>
    <style>
      :root {
        --bg: #f6f7f9;
        --surface: #ffffff;
        --ink: #1d2430;
        --muted: #667085;
        --line: #d9dee7;
        --accent: #0f766e;
        --accent-soft: #dff5f1;
        --danger: #b42318;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        padding: 28px;
        background: var(--bg);
        color: var(--ink);
        font-family: "Avenir Next", "Segoe UI", "Helvetica Neue", sans-serif;
      }

      main {
        max-width: 900px;
        margin: 0 auto;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 24px;
        box-shadow: 0 8px 24px rgba(16, 24, 40, 0.08);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.8rem;
      }

      p {
        color: var(--muted);
        line-height: 1.55;
      }

      code,
      textarea {
        font-family: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
      }

      textarea {
        width: 100%;
        min-height: 120px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        resize: vertical;
        color: var(--ink);
      }

      .panel {
        margin-top: 18px;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fbfcfd;
      }

      .success {
        border-left: 4px solid var(--accent);
      }

      .missing {
        border-left: 4px solid var(--danger);
      }

      button {
        min-height: 38px;
        margin-top: 10px;
        padding: 8px 12px;
        border: 1px solid var(--accent);
        border-radius: 7px;
        background: var(--accent);
        color: white;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      .command {
        display: block;
        padding: 10px;
        border-radius: 7px;
        background: var(--accent-soft);
        color: var(--ink);
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Mendeley OAuth Token Helper</h1>
      <p>
        This local page extracts the temporary Mendeley access token from the URL fragment.
        Do not paste this token into chat or commit it to git.
      </p>

      <section id="token-panel" class="panel"></section>
    </main>

    <script>
      const panel = document.getElementById("token-panel");
      const params = new URLSearchParams(window.location.hash.slice(1));
      const token = params.get("access_token");
      const state = params.get("state");

      function copy(value, button) {
        navigator.clipboard.writeText(value).then(() => {
          const previous = button.textContent;
          button.textContent = "Copied";
          setTimeout(() => {
            button.textContent = previous;
          }, 1400);
        });
      }

      if (!token) {
        panel.className = "panel missing";
        panel.innerHTML = `
          <h2>No token found yet</h2>
          <p>Open the authorization URL generated by <code>scripts/mendeley_auth_url.py</code>. After Mendeley redirects back here, the access token will appear on this page.</p>
        `;
      } else {
        panel.className = "panel success";
        const exportCommand = `export MENDELEY_ACCESS_TOKEN="${token}"`;
        panel.innerHTML = `
          <h2>Token received</h2>
          <p>This implicit-flow token is temporary. Use it soon, then close this page.</p>
          <label for="token-box"><strong>Access token</strong></label>
          <textarea id="token-box" readonly>${token}</textarea>
          <button id="copy-token" type="button">Copy token</button>
          <h3>Terminal export command</h3>
          <code class="command" id="export-command">${exportCommand}</code>
          <button id="copy-export" type="button">Copy export command</button>
          <p>State returned: <code>${state || "(none)"}</code></p>
        `;
        document.getElementById("copy-token").addEventListener("click", (event) => copy(token, event.target));
        document.getElementById("copy-export").addEventListener("click", (event) => copy(exportCommand, event.target));
      }
    </script>
  </body>
</html>
